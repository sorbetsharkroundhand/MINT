name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mint:
    name: MINT / Debug Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain info
        run: |
          uname -m
          swift --version
          xcodebuild -version

      - name: Resolve dependencies
        run: |
          swift package resolve
          git diff --exit-code -- Package.resolved

      - name: Build MINT
        run: swift build --product MINT

      - name: Test MINTCore
        run: swift test

      - name: Build MINTBench
        run: swift build --product MINTBench

      - name: Benchmark CLI preflight smoke (no model required)
        run: scripts/test-mint-bench-cli.sh

  app:
    name: App / Release Bundle & Smoke
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain info
        run: |
          uname -m
          swift --version
          xcodebuild -version

      - name: Compute metallib cache key
        id: metallib-cache-key
        run: |
          echo "xcode=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore MLX metallib cache
        uses: actions/cache@v6
        with:
          path: .build/metallib-cache
          key: mlx-metallib-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.metallib-cache-key.outputs.xcode }}-${{ hashFiles('Package.resolved') }}

      - name: Allow package macros in CI
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Build MINT.app
        run: scripts/build-mint-app.sh

      - name: Validate app bundle
        run: |
          test -x build/MINT.app/Contents/MacOS/MINT
          test -s build/MINT.app/Contents/MacOS/mlx.metallib
          plutil -lint build/MINT.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 build/MINT.app

      - name: Verify privacy manifest packaging and rejection regressions
        run: python3 scripts/test-mint-privacy.py build/MINT.app

      - name: Verify dependency notices and packaged resources without launching the app
        run: |
          python3 scripts/test-mint-notices.py
          python3 scripts/mint-notices.py --checkouts .build/checkouts --validate-app build/MINT.app

      - name: Launch smoke test
        run: scripts/smoke-mint-app.sh

      - name: Upload smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failure-diagnostics
          path: build/smoke-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  archive:
    name: App / Unsigned Xcode Archive
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain info
        run: |
          uname -m
          swift --version
          xcodebuild -version

      - name: Resolve locked dependencies
        run: |
          swift package resolve
          git diff --exit-code -- Package.resolved

      - name: Build and validate unsigned archive
        run: scripts/archive-mint-app.sh

      - name: Verify archive validation regressions
        run: scripts/test-mint-archive-validation.sh

      - name: Verify sandbox container storage
        run: scripts/test-mint-sandbox-storage.sh

      - name: Verify sandboxed MLX resource errors (no GPU required)
        run: scripts/test-mint-sandbox-mlx.sh --resource-errors-only

      - name: Package inspectable archive
        run: ditto -c -k --sequesterRsrc --keepParent build/MINT.xcarchive build/MINT.xcarchive.zip

      - name: Upload unsigned archive
        uses: actions/upload-artifact@v7
        with:
          name: MINT-unsigned-xcarchive
          path: build/MINT.xcarchive.zip
          if-no-files-found: error
          retention-days: 14
