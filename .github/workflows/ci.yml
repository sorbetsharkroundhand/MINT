name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # MLX 0.32 requires Swift 6.3; pin the image toolchain for CLI and Xcode builds.
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  purlory:
    name: Purlory / Debug Build & Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain info
        run: |
          uname -m
          swift --version
          xcodebuild -version

      - name: Resolve dependencies
        # Local binary/resource inputs must exist before SwiftPM loads the manifest.
        run: |
          scripts/prepare-korean-backend.sh
          swift package resolve
          git diff --exit-code -- Package.resolved

      - name: Verify support diagnostics exclude writer data
        run: |
          python3 scripts/test-purlory-support.py
          python3 scripts/test-purlory-identity.py

      - name: Verify Korean backend artifact and budget rejection paths
        run: |
          python3 scripts/test-korean-backend-validation.py
          python3 scripts/test-korean-backend-preparation.py

      - name: Build Purlory
        run: swift build --product Purlory

      - name: Test PurloryCore
        run: swift test

      - name: Build PurloryBench
        run: swift build --product PurloryBench

      - name: Benchmark CLI preflight smoke (no model required)
        run: scripts/test-purlory-bench-cli.sh

  app:
    name: App / Release Bundle & Smoke
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain info
        run: |
          uname -m
          swift --version
          xcodebuild -version

      - name: Compute metallib cache key
        id: metallib-cache-key
        run: |
          echo "xcode=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore MLX metallib cache
        uses: actions/cache@v6
        with:
          path: .build/metallib-cache
          key: mlx-metallib-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.metallib-cache-key.outputs.xcode }}-${{ hashFiles('Package.resolved') }}

      - name: Allow package macros in CI
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Build Purlory.app
        run: scripts/build-purlory-app.sh

      - name: Validate app bundle
        run: |
          test -x build/Purlory.app/Contents/MacOS/Purlory
          test -s build/Purlory.app/Contents/MacOS/mlx.metallib
          plutil -lint build/Purlory.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 build/Purlory.app

      - name: Verify privacy manifest packaging and rejection regressions
        run: python3 scripts/test-purlory-privacy.py build/Purlory.app

      - name: Verify dependency notices and packaged resources without launching the app
        run: |
          python3 scripts/test-purlory-notices.py
          python3 scripts/purlory-notices.py --checkouts .build/checkouts --validate-app build/Purlory.app

      - name: Launch smoke test
        run: scripts/smoke-purlory-app.sh

      - name: Upload smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failure-diagnostics
          path: build/smoke-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect artifact support context
        if: always()
        run: python3 scripts/collect-purlory-support.py --app build/Purlory.app --output build/support-app.json --expect-source-revision "$(git rev-parse HEAD)"

      - name: Upload artifact support context
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: support-app
          path: build/support-app.json
          if-no-files-found: error
          retention-days: 7

  archive:
    name: App / Unsigned Xcode Archive
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain info
        run: |
          uname -m
          swift --version
          xcodebuild -version

      - name: Resolve locked dependencies
        run: |
          scripts/prepare-korean-backend.sh
          swift package resolve
          git diff --exit-code -- Package.resolved

      - name: Build and validate unsigned archive
        run: scripts/archive-purlory-app.sh

      - name: Verify archive validation regressions
        run: scripts/test-purlory-archive-validation.sh

      - name: Verify sandbox container storage
        run: scripts/test-purlory-sandbox-storage.sh

      - name: Verify sandboxed MLX resource errors (no GPU required)
        run: scripts/test-purlory-sandbox-mlx.sh --resource-errors-only

      - name: Package inspectable archive
        run: ditto -c -k --sequesterRsrc --keepParent build/Purlory.xcarchive build/Purlory.xcarchive.zip

      - name: Upload unsigned archive
        uses: actions/upload-artifact@v7
        with:
          name: Purlory-unsigned-xcarchive
          path: build/Purlory.xcarchive.zip
          if-no-files-found: error
          retention-days: 14

      - name: Collect archive support context
        if: always()
        run: python3 scripts/collect-purlory-support.py --app build/Purlory.xcarchive/Products/Applications/Purlory.app --output build/support-archive.json --expect-source-revision "$(git rev-parse HEAD)"

      - name: Upload archive support context
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: support-archive
          path: build/support-archive.json
          if-no-files-found: error
          retention-days: 7
